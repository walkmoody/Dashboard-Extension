<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="newtab.css" />
    <link rel="icon" href="assets/empty.png" />
    <script src="newtab.js" defer></script>
  </head>
  <body>
    <canvas id="fluid-canvas"></canvas>
     <main class="wrap">
      <!--<div id="greeting" class="greeting"></div>-->
      <div id="clock" class="clock"></div>
      <header class="top">
        <div class="actions">
          <form id="searchForm" class="searchForm">
            <input id="q" class="search" placeholder="search." />
          </form>
        </div>
         
      </header>

      <section class="card">
        <div id="links" class="grid"></div>
      </section>

      <div id="todoOrAi">
        <section id="todoSection" class="card todo-section">
          <div class="todo-header">
            <span class="todo-title">tasks</span>
          </div>
          <div id="todoList"></div>
        </section>

        <section id="ollamaPanel" class="card todo-section ollama-panel hidden">
          <div class="ollama-header">
            <span class="ollama-icon">✦</span>
            <span class="ollama-title">AI</span>
            <span id="ollamaSpinner" class="ollama-spinner hidden"></span>
          </div>
          <div class="ollama-divider"></div>
          <div id="ollamaText" class="ollama-text"></div>
        </section>
      </div>

      <footer class="bottom">
        <div class="actions">
          <form id="bingForm" class="searchForm">
            <input id="bingQ" class="search" placeholder="bing." />
          </form>
        </div>
      </footer>
    </main>
    <div id="ollamaToggle" class="ollama-toggle">
      <span class="ollama-toggle-opt active" data-side="tasks">tasks</span>
      <span class="ollama-toggle-opt" data-side="ai">AI summary</span>
    </div>
  </body>
</html>
